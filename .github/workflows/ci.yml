name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  commit-messages:
    name: Check commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install commitlint
        run: npm ci --ignore-scripts

      - name: Check pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  check:
    name: Check (${{ matrix.architecture }}, stable)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86-64
            runner: ubuntu-24.04
          - architecture: ARM64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Run checks and integration tests
        run: make check

  msrv:
    name: Check (Rust 1.89)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - name: Check all targets
        run: cargo check --locked --all-targets --all-features

  musl:
    name: Distribution (${{ matrix.architecture }} Linux)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - architecture: ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://releases.nixos.org/nix/nix-2.35.1/install \
            --output nix-install
          echo "34e0ef63ec1f3e552e15069660afd9a0a23f69009e340c33067595252888286c  nix-install" \
            | sha256sum --check
          sh nix-install --daemon --no-channel-add --yes
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Build and verify distribution
        run: make dist-check DIST_TARGET=${{ matrix.target }}

      - name: Attest distribution
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: target/dist/agentknock-${{ matrix.target }}.tar.gz.sha256

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentknock-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  installer:
    name: Installer
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: >-
          shellcheck install.sh scripts/check-dist scripts/check-npm-dist
          scripts/package-npm tests/install.sh tests/npm.sh

      - name: Build and test installer
        run: make installer-dist

      - name: Attest installer
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: target/installer/install.sh.sha256

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentknock-installer
          path: target/installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npm:
    name: npm package
    needs: musl
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Download Linux distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentknock-*-unknown-linux-musl
          path: target/dist
          merge-multiple: true

      - name: Build and test npm package
        run: make npm-dist-check

      - name: Attest npm package
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/npm/agentknock-*.tgz

      - name: Upload npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentknock-npm
          path: target/npm/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  dependencies:
    name: Check dependencies
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-deny
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            --output cargo-deny.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  cargo-deny.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file cargo-deny.tar.gz
          install cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny \
            "$HOME/.cargo/bin/cargo-deny"

      - name: Check dependencies
        run: make dependency-check

  release-readiness:
    name: Check release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify package
        run: make package-check

      - name: Check release plan
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.head_ref, 'release-plz-')
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs:
      - check
      - msrv
      - musl
      - installer
      - npm
      - dependencies
      - release-readiness
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Configure GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git --hostname github.com --force

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentknock-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify release assets
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum --check -- *.sha256

      - name: Prepare or publish release
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read release result
        if: steps.release-plz.outputs.releases_created == 'true'
        id: release
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(printf '%s' "$RELEASES" \
            | jq --exit-status --raw-output \
              'if length == 1 then .[0].tag else error("expected one release") end')
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Attach release assets
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "${{ runner.temp }}"/release-assets/*

      - name: Publish immutable release
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag

      - name: Delete obsolete release branches
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_branches=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[].head.ref')

          while IFS= read -r branch; do
            if ! printf '%s\n' "$open_branches" \
              | grep --fixed-strings --line-regexp --quiet -- "$branch"; then
              echo "Deleting obsolete release branch: $branch"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            fi
          done < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" \
            --jq '.[].name | select(startswith("release-plz-"))')

  npm-publish:
    name: Publish npm package
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agentknock-npm
          path: ${{ runner.temp }}/npm

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@12.0.2

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
        run: |
          package="${{ runner.temp }}/npm/agentknock-${RELEASE_TAG#v}.tgz"
          test -f "$package"
          npm publish "$package" --access public --provenance
