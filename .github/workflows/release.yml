name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'agentknock/agentknock-cli'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Prepare release and check release plan
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          dry_run: true
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete obsolete release branches
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_branches=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[].head.ref')

          while IFS= read -r branch; do
            if ! printf '%s\n' "$open_branches" \
              | grep --fixed-strings --line-regexp --quiet -- "$branch"; then
              echo "Deleting obsolete release branch: $branch"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            fi
          done < <(gh api --paginate "repos/$GH_REPO/branches?per_page=100" \
            --jq '.[].name | select(startswith("release-plz-"))')

  distribution:
    name: Release distribution (${{ matrix.architecture }} Linux)
    needs: prepare
    if: needs.prepare.outputs.releases_created == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86-64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - architecture: ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        run: |
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://releases.nixos.org/nix/nix-2.35.1/install \
            --output nix-install
          echo "34e0ef63ec1f3e552e15069660afd9a0a23f69009e340c33067595252888286c  nix-install" \
            | sha256sum --check
          sh nix-install --daemon --no-channel-add --yes
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Build and verify distribution
        run: make dist-check DIST_TARGET=${{ matrix.target }}

      - name: Attest distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: target/dist/agentknock-${{ matrix.target }}.tar.gz.sha256

      - name: Stage distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: target/dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  installer:
    name: Release installer
    needs: prepare
    if: needs.prepare.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint installer
        run: shellcheck install.sh tests/install.sh

      - name: Build and test installer
        run: make installer-dist

      - name: Attest installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: target/installer/install.sh.sha256

      - name: Stage installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-installer
          path: target/installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish release
    needs:
      - prepare
      - distribution
      - installer
    if: needs.prepare.outputs.releases_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Verify release assets
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum --check -- *.sha256

      - name: Create draft release and publish crate
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release result
        id: release
        env:
          ACTUAL_RELEASES: ${{ steps.release-plz.outputs.releases }}
          PLANNED_RELEASES: ${{ needs.prepare.outputs.releases }}
        run: |
          actual_tag=$(printf '%s' "$ACTUAL_RELEASES" \
            | jq --exit-status --raw-output \
              'if length == 1 then .[0].tag else error("expected one release") end')
          planned_tag=$(printf '%s' "$PLANNED_RELEASES" \
            | jq --exit-status --raw-output \
              'if length == 1 then .[0].tag else error("expected one planned release") end')
          if [ "$actual_tag" != "$planned_tag" ]; then
            echo "release tag $actual_tag does not match planned tag $planned_tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$actual_tag" >> "$GITHUB_OUTPUT"

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "${{ runner.temp }}"/release-assets/*

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
