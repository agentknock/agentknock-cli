[package]
name = "agentknock"
version = "0.1.0"
categories = ["authentication", "command-line-utilities", "cryptography"]
documentation = "https://docs.rs/agentknock"
edition = "2024"
homepage = "https://agentknock.dev/"
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE*",
]
keywords = ["agents", "approval", "authorization", "mobile", "secrets"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/nakedible/agentknock-cli"
rust-version = "1.89"
description = "Mobile-approved secret delivery for command-line tools and applications."

[features]
integration-tests = []

[dependencies]
atomic-write-file = "0.3.0"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.32", features = ["sink"] }
getrandom = "0.4.3"
hkdf = "0.13.0"
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "chacha", "getrandom", "x25519"] }
http = "1.4.0"
libc = "0.2.189"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["aws_lc_rs", "client", "getrandom", "rustls-platform-verifier"] }
ulid = "3.0.0"

[dev-dependencies]
tokio-websockets = { version = "0.13.3", default-features = false, features = ["server"] }

[[test]]
name = "exec"
path = "tests/exec.rs"
required-features = ["integration-tests"]

[[test]]
name = "secret_list"
path = "tests/secret_list.rs"
required-features = ["integration-tests"]

[[test]]
name = "pairing"
path = "tests/pairing.rs"
required-features = ["integration-tests"]

[[test]]
name = "secret_upload"
path = "tests/secret_upload.rs"
required-features = ["integration-tests"]
